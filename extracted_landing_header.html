<!-- Actions & Search -->

<div class="hidden sm:flex items-center border border-outline-variant/60 rounded-full px-3 py-1.5 bg-surface-container-low focus-within:border-primary transition-all">

<button class="relative flex items-center gap-2 bg-primary-container text-surface-bright px-4 py-2 rounded-full hover:bg-primary transition-all duration-300 shadow-sm cursor-pointer" onclick="toggleCart()">
<span class="material-symbols-outlined text-base" data-icon="shopping_bag">shopping_bag</span>
<span class="text-[11px] font-medium tracking-[0.2em] uppercase">BAG (<span id="cart-counter" class="">2</span>)</span>
</button>
<!-- Mobile Menu Toggle -->
<button aria-label="Open Navigation" class="xl:hidden p-2 text-primary" onclick="alert('Menu navigation triggered.')">
